services:
  postgres:
    image: postgres:16
    container_name: code_assembler_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: code_assembler
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - code_assembler_pgdata:/var/lib/postgresql/data

volumes:
  code_assembler_pgdata:
